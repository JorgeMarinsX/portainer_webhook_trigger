[project]
name = "webhook-cron-trigger"
version = "0.1.0"
description = "Calls Portainer webhooks on a cron schedule."
requires-python = ">=3.13"
dependencies = [
    "apscheduler>=3.11",
    "tzdata>=2025.1",
    "uvicorn>=0.35",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["app"]
testpaths = ["tests"]
